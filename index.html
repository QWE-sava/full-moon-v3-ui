<script>
        const API_BASE = "https://full-moon-v3.nengjianxingtai44.workers.dev"; 
        const CLUBS = ["物理研究部", "化学部", "生物部", "地学部", "マジック同好会", "吹奏楽部", "鉄道研究部"];
        
        let currentVoterId = null;
        let isProcessing = false;
        let modelsLoaded = false;

        async function init() {
            const status = document.getElementById('status-text');
            status.innerText = "AIモデルを準備中...";
            
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            
            try {
                // モデル読み込み
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                modelsLoaded = true;
                
                // カメラ起動
                const video = document.getElementById('video');
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: 640, height: 480 } 
                });
                video.srcObject = stream;

                // ビデオが実際に再生開始されるのを待つ
                video.onloadedmetadata = () => {
                    video.play();
                    status.innerText = "準備完了！顔を映してください";
                    processLoop(); // ここでループ開始！
                };
                
            } catch (err) {
                status.innerText = "エラー: " + err.message;
                console.error(err);
            }
        }

        async function processLoop() {
            // 1. 認証済み、処理中、またはモデル未ロードなら次へ
            if (currentVoterId || isProcessing || !modelsLoaded) {
                setTimeout(() => processLoop(), 500); // 0.5秒後に再試行
                return;
            }

            const video = document.getElementById('video');
            
            // ビデオが準備できていない場合はスキップ
            if (video.paused || video.ended || video.readyState < 2) {
                requestAnimationFrame(processLoop);
                return;
            }

            try {
                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                                    .withFaceLandmarks().withFaceDescriptor();

                if (detection) {
                    const landmarks = detection.landmarks;
                    const nose = landmarks.getNose();
                    const mouth = landmarks.getMouth();

                    // マスク・眼鏡チェック
                    if (!nose || nose.length < 5 || !mouth || mouth.length < 5) {
                        showAlert(true);
                        requestAnimationFrame(processLoop);
                    } else {
                        showAlert(false);
                        await handleAuth(detection.descriptor);
                        // handleAuthが終わるまでloopは止まる
                    }
                } else {
                    showAlert(false);
                    requestAnimationFrame(processLoop);
                }
            } catch (e) {
                console.error("Detection Error:", e);
                requestAnimationFrame(processLoop);
            }
        }

        function showAlert(show) {
            document.getElementById('face-alert').style.visibility = show ? "visible" : "hidden";
        }

        async function handleAuth(descriptor) {
            isProcessing = true;
            const status = document.getElementById('status-text');
            status.innerText = "解析中...";

            try {
                const res = await fetch(`${API_BASE}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vector: Array.from(descriptor) })
                });
                const data = await res.json();

                if (data.is_voted) {
                    status.innerText = "既に投票済みです";
                    // 3秒待ってからスキャン再開
                    await new Promise(r => setTimeout(r, 3000));
                    isProcessing = false;
                    status.innerText = "カメラに顔を映してください";
                    requestAnimationFrame(processLoop);
                } else {
                    currentVoterId = data.voter_id;
                    transitionTo("screen-vote");
                }
            } catch (e) {
                status.innerText = "通信エラー。再試行中...";
                await new Promise(r => setTimeout(r, 2000));
                isProcessing = false;
                requestAnimationFrame(processLoop);
            }
        }

        function transitionTo(targetId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(targetId).classList.remove('hidden');

            if (targetId === "screen-vote") {
                const grid = document.getElementById('club-grid');
                grid.innerHTML = '';
                CLUBS.forEach(club => {
                    const card = document.createElement('div');
                    card.className = 'club-card';
                    card.innerText = club;
                    card.onclick = () => submitVote(club);
                    grid.appendChild(card);
                });
            }
        }

        async function submitVote(club) {
            try {
                const res = await fetch(`${API_BASE}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voter_id: currentVoterId, club_name: club })
                });
                if (res.ok) showThanks();
            } catch (e) {
                alert("送信に失敗しました");
            }
        }

        function showThanks() {
            transitionTo("screen-thanks");
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

            setTimeout(() => {
                currentVoterId = null;
                isProcessing = false;
                document.getElementById('status-text').innerText = "カメラに顔を映してください";
                transitionTo("screen-auth");
                requestAnimationFrame(processLoop); // 監視再開
            }, 5000);
        }

        window.onload = init;
    </script>
